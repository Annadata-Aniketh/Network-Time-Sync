[tool.ruff]
target-version = "py312"
line-length = 100
include = ["app/**/*.py", "evaluation/**/*.py", "scripts/**/*.py", "sdn/**/*.py", "topology/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"evaluation/audit_results.py" = ["E402"]
"evaluation/benchmark.py" = ["E402"]
"sdn/run_controller.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", "tmp", ".venv"]
